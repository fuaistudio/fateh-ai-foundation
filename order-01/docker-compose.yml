services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fateh
      POSTGRES_USER: fateh
      POSTGRES_PASSWORD: change-this-local-password
    volumes:
      - fateh_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fateh -d fateh"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fateh:change-this-local-password@db:5432/fateh
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  fateh_postgres:
